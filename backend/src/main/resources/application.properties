spring.application.name=demo

# ---------------- BANCO DE DADOS (MySQL) ----------------
# Valores padrão para desenvolvimento local; sobrescreva com variáveis de ambiente
# ou no arquivo secrets.properties (veja secrets.properties.example).
# createDatabaseIfNotExist=true cria o banco "imobiliaria" sozinho na primeira execução.
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:imobiliaria}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------- SEGREDOS (NÃO versionados) ----------------
# Se existir, o arquivo secrets.properties sobrescreve qualquer valor deste arquivo.
spring.config.import=optional:classpath:secrets.properties

#FOTOS
app.upload-dir=./uploads
spring.servlet.multipart.enabled=true

#email (Mailgun) - credenciais vêm de variáveis de ambiente ou do secrets.properties
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

#SEGURANCA / JWT
# O valor padrão abaixo serve só para desenvolvimento (mínimo 32 caracteres).
# Em produção defina JWT_SECRET.
app.jwt.secret=${JWT_SECRET:chave-apenas-para-desenvolvimento-local-troque-em-producao}
app.jwt.expiration-minutes=120

# Admin criado automaticamente na primeira execucao (se nao existir)
app.admin.nome=Administrador
app.admin.email=admin@imobiliaria.com
app.admin.senha=admin123
